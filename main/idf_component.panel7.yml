# Manifest for the 7" 1024x600 MIPI-DSI panel variant
# (Waveshare ESP32-P4-WIFI6-Touch-LCD-7B).
# Selected automatically by the top-level CMakeLists.txt based on the active
# SDKCONFIG_DEFAULTS overlay. Do NOT edit main/idf_component.yml directly --
# it is regenerated from this file on every configure.
dependencies:
  idf: ">=5.5"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  lvgl/lvgl:
    version: "^9"
  waveshare/esp32_p4_wifi6_touch_lcd_7b:
    version: "^3.0.1"
    rules:
      - if: "target in [esp32p4]"
  # The 7B BSP uses esp_lvgl_adapter internally and does NOT pull
  # esp_lvgl_port (unlike the 4B BSP), so add it explicitly here.
  espressif/esp_lvgl_port:
    version: "^2.7.2"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch:
    version: "^1.2.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch_gt911:
    version: "1.2.0~2"
    rules:
      - if: "target in [esp32p4]"
  joltwallet/littlefs:
    version: "^1.20.2"
  espressif/esp_hosted:
    version: "2.11.7"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_websocket_client:
    version: "*"
  78/esp-opus:
    version: "1.0.*"
